<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشة البداية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#1a2128;font-family:Cairo,Tahoma,'Segoe UI',sans-serif;color:#fff}
#st{position:absolute;left:50%;top:50%;width:1536px;height:691px;transform-origin:center;overflow:hidden;background:radial-gradient(ellipse 560px 320px at 50% 56%,#f4f7f8,transparent 72%),linear-gradient(#6a8ba3,#a7bfce 45%,#e2eaee 78%)}
.cl{position:absolute;left:0;aspect-ratio:3;opacity:.95;animation:dr linear infinite}
@keyframes dr{from{transform:translateX(-420px)}to{transform:translateX(1560px)}}
.gd{position:absolute;left:0;right:0;top:612px;bottom:0;background:linear-gradient(#2c363c,#222a30);border-top:3px solid #1b2328}
.card{position:absolute;top:160px;height:312px;border:5px solid #fff;border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.22);transition:transform .15s}
#st.go .card{animation:up .55s backwards}
.card:hover{transform:translateY(-4px)}.card:active{transform:scale(.97)}
@keyframes up{from{opacity:0;transform:translateY(40px)}}
#prof{position:absolute;left:0;top:0;width:380px;height:110px;cursor:pointer;z-index:6}
#prof>*{position:absolute}
.av{left:82px;top:6px;width:78px;height:88px;border-radius:50% 50% 46% 46%;background:radial-gradient(#ecd0a8,#b58658);border:3px solid #fff;display:grid;place-items:center;font-size:52px;animation:pu 2.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 8px rgba(255,255,255,.35)}}
.ls{left:166px;top:2px;width:48px;height:48px;display:grid;place-items:center;z-index:2}
.ls svg{position:absolute;inset:0;width:100%;height:100%}
.ls b{position:relative;font-size:21px;font-weight:900}
.bump{animation:bp .9s}
@keyframes bp{40%{transform:scale(1.6) rotate(18deg)}}
.xpb{left:200px;top:14px;width:148px;height:26px;border-radius:9px;background:#27323b;border:2px solid #1b242b;overflow:hidden}
.xpb i{display:block;height:100%;border-radius:6px;background:linear-gradient(#5ed3ff,#1c9be0);transition:width .6s}
.fb{left:174px;top:56px;font-size:34px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.un{left:222px;top:52px;font-size:26px;font-weight:800;text-shadow:0 2px 3px rgba(0,0,0,.45)}
.gear{position:absolute;left:80px;top:528px;width:52px;height:52px;border-radius:13px;background:linear-gradient(#ffb62e,#f08a0a);border:3px solid #ffd27a;color:#fff;font-size:34px;display:grid;place-items:center;cursor:pointer}
#ov{position:absolute;inset:0;background:rgba(10,20,30,.62);display:none;place-items:center;z-index:20}
#ov.on{display:grid}
.pn{position:relative;width:860px;height:530px;border:6px solid #fff;border-radius:26px;background:linear-gradient(#34506a,#1d2f3f);box-shadow:0 12px 0 rgba(0,0,0,.3);padding:20px 28px;animation:up .3s}
.pn h2{margin:0 0 12px;text-align:center;font-size:34px;font-weight:900;color:#ffd23f}
.x{position:absolute;left:14px;top:12px;width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:#5b7488;color:#fff;font-size:22px;font-weight:900;cursor:pointer}
.pb{display:flex;gap:26px;height:420px}
.col{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.col.l{flex:0 0 320px;align-items:center;text-align:center}
.col h3{margin:0;font-size:20px;font-weight:800}
.big{width:112px;height:112px;border-radius:50%;background:radial-gradient(#ecd0a8,#b58658);border:4px solid #fff;display:grid;place-items:center;font-size:72px}
#nm{width:100%;height:44px;border-radius:12px;border:3px solid #5b7488;background:#14212b;color:#fff;font:800 22px Cairo,sans-serif;text-align:center;outline:0}
.rel{position:relative;width:100%}
.xpb.big{position:relative;left:auto;top:auto;width:100%;height:34px;border-radius:12px;display:grid;place-items:center}
.xpb.big i{position:absolute;left:0;top:0}
.xpb.big span{position:relative;font-weight:800;font-size:16px;text-shadow:0 1px 2px #000}
.sm{font-size:13px;opacity:.8;line-height:1.4}
.btn{height:48px;width:100%;border-radius:14px;border:3px solid #fff;background:linear-gradient(#58d27a,#2fa55a);color:#fff;font:900 20px Cairo,sans-serif;cursor:pointer}
.btn:active{transform:scale(.96)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;overflow:auto;padding:8px;flex:1;background:rgba(0,0,0,.22);border-radius:14px;align-content:start}
.f{border:3px solid transparent;border-radius:12px;background:rgba(255,255,255,.08);color:#fff;font:700 13px Cairo,sans-serif;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.f span{font-size:34px;line-height:1.15}
.f.on{border-color:#ffd23f;background:rgba(255,210,63,.22)}
.pop{position:absolute;left:50%;white-space:nowrap;font-weight:900;font-size:22px;color:#ffe45e;text-shadow:0 2px 3px #000;pointer-events:none;animation:rs 1.3s forwards;z-index:5}
@keyframes rs{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-46px)}}
#prof .pop{left:275px;top:44px}
#pm .pop{top:-8px}
.card::before{content:"";position:absolute;inset:-30px;background:var(--i) center/cover;filter:blur(18px) brightness(.55) saturate(1.3)}
.gm{position:absolute;inset:0;background:var(--i) center/contain no-repeat}

#intro{position:fixed;inset:0;background:#000;z-index:100;overflow:hidden;cursor:pointer}
#inFrame{position:absolute;left:50%;top:50%}
#inCv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#inCardWrap{position:absolute;perspective:800px}
#inCard{display:block;width:100%;height:100%;transform-origin:50% 90%;animation:inFloat 5s ease-in-out infinite;will-change:transform}
@keyframes inFloat{0%,100%{transform:rotateY(-9deg) translateY(0)}50%{transform:rotateY(9deg) translateY(-4px)}}
#inHint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:14px;font-weight:600;color:#fff;opacity:.45}
#inFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

/* ===== lobby + room screens (drawn in 2400x1080 space, scaled .64 into the stage) ===== */
#scr{position:absolute;inset:0;z-index:5;display:none;overflow:hidden}
#scr.fadein{animation:kfi .3s}#scr.fadeout{animation:kfo .3s forwards}
@keyframes kfi{from{opacity:0}}@keyframes kfo{to{opacity:0}}
#kin{position:absolute;left:0;top:0;width:2400px;height:1080px;transform:scale(.64);transform-origin:0 0;overflow:hidden;background:linear-gradient(#6a92b4 0,#86aac3 14%,#adc4d2 26%,#c5d3da 30.3%)}
.kglow{position:absolute;left:700px;top:60px;width:1000px;height:560px;background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.85),rgba(255,255,255,0) 68%)}
.kcl{position:absolute;aspect-ratio:3;opacity:.92;animation:kdrift 22s ease-in-out infinite alternate}
@keyframes kdrift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.ksun{position:absolute;left:1103px;top:283px;width:194px;height:194px;border-radius:50%;background:rgba(236,236,236,.82)}
#ksk{position:absolute;inset:0;width:100%;height:100%}
.kpg{position:absolute;inset:0;display:none}
.kpg.in{animation:kpi .32s both}.kpg.out{animation:kpo .22s both}
@keyframes kpi{from{opacity:0;transform:translateY(24px)}}@keyframes kpo{to{opacity:0;transform:translateY(-16px)}}
#kback{position:absolute;left:115px;top:228px;width:108px;height:96px;border-radius:30px;border:4px solid #1b9bf2;background:linear-gradient(#3cbcff,#0e86e0);box-shadow:0 7px 0 #0a5a9c;cursor:pointer;display:grid;place-items:center;padding:0;z-index:3}
#kback::before{content:"";position:absolute;left:10%;right:10%;top:6px;height:34%;border-radius:22px;background:rgba(255,255,255,.22)}
#kback svg{position:relative;width:70px;height:56px}
#kback:active{transform:translateY(3px);box-shadow:0 4px 0 #0a5a9c}
/* buttons */
.kb{position:relative;display:grid;place-items:center;cursor:pointer;color:#fff;font:900 38px Cairo,sans-serif;padding:0;text-shadow:0 3px 0 rgba(0,0,0,.3);border-radius:40px;height:80px;transition:transform .12s,box-shadow .12s,filter .2s}
.kb::before{content:"";position:absolute;left:12%;right:12%;top:6px;height:36%;border-radius:22px;background:rgba(255,255,255,.28)}
.kb span{position:relative}.kb:active{transform:translateY(3px)}
.kr{border:3px solid #ff948a;background:linear-gradient(#f2594d,#cc2821);box-shadow:0 6px 0 #8c1a17}.kr:active{box-shadow:0 3px 0 #8c1a17}
.kbl{border:3px solid #8fd6ff;background:linear-gradient(#3cbcff,#0e86e0);box-shadow:0 6px 0 #0a5a9c;font-size:34px}.kbl:active{box-shadow:0 3px 0 #0a5a9c}
.kp{border:4px solid #f3b6e6;background:linear-gradient(#e993d8,#c24fa8);box-shadow:0 6px 0 #9c3a86}.kp:active{box-shadow:0 3px 0 #9c3a86}
.kg{border-color:#c3c9cc!important;background:linear-gradient(#a2abb0,#737c82)!important;box-shadow:0 6px 0 #4a5155!important;color:#e6eaec}
.kb.ready{animation:kpulse 1.4s ease-in-out infinite}
@keyframes kpulse{50%{filter:brightness(1.12);transform:scale(1.025)}}
.kh{position:absolute;left:0;right:0;top:0;height:66px;background:rgba(255,255,255,.13);border-bottom:2px solid rgba(255,255,255,.85);text-align:center;font:900 46px/66px Cairo,sans-serif;text-shadow:0 3px 0 rgba(0,0,0,.3)}
/* lobby cards */
.kc{position:absolute;top:360px;width:660px;height:560px;border:10px solid #fff;border-radius:28px;overflow:hidden;padding-top:66px;display:flex;flex-direction:column;box-shadow:0 10px 0 rgba(0,0,0,.22),0 0 44px rgba(0,0,0,.25);animation:kup .55s backwards;transition:transform .2s}
.kc:hover{transform:translateY(-4px)}
@keyframes kup{from{opacity:0;transform:translateY(40px)}}
#kc1{left:505px;background:linear-gradient(#e27fc2,#cc55a6)}
#kc2{left:1235px;background:linear-gradient(#10a6f4,#0376d2);animation-delay:.1s}
#kc2 .kh{background:none;border-bottom:0}
.kem{height:270px;flex:none;display:grid;place-items:center}
.kem svg{width:210px;height:210px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.25));animation:kfloat 4s ease-in-out infinite}
@keyframes kfloat{50%{transform:translateY(-8px)}}
.kbt{margin-top:auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:18px}
.kcap{height:80px;display:grid;place-items:center;text-align:center;font:800 28px/1.3 Cairo,sans-serif;opacity:.92;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.kres.show{animation:kslide .4s}
@keyframes kslide{from{opacity:0;transform:translateY(-14px) scale(.96)}}
/* room card */
#kr{position:absolute;left:340px;top:290px;width:1720px;height:660px;border:10px solid #fff;border-radius:28px;overflow:hidden;background:linear-gradient(#e27fc2,#cc55a6);box-shadow:0 10px 0 rgba(0,0,0,.22),0 0 44px rgba(0,0,0,.25);animation:kup .55s backwards}
.kd{position:absolute;left:0;right:0;top:66px;bottom:0}
#kr.host .j-only,#kr.join .h-only{display:none!important}
.kdk{background:rgba(92,30,70,.55);border-radius:16px}
.klp{position:absolute;left:18px;top:14px;width:520px;height:546px}
.klp>*{position:absolute;left:0;right:0}
.kcb{top:0;height:150px;text-align:center}
.kcb .t{position:absolute;left:0;right:0;top:10px;font:800 28px/1.2 Cairo,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.kcb .c{position:absolute;left:24px;top:52px;direction:ltr;font:900 76px/1 Cairo,sans-serif;letter-spacing:10px;color:#4df3ff;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.kcb .kb{left:auto;right:20px;top:60px;width:128px;height:60px;font-size:28px;border-radius:30px}
.ksb{top:162px;height:184px;background:rgba(70,22,54,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ksb .t{font:800 28px/1 Cairo,sans-serif}
.ksb .n{font:900 70px/1 Cairo,sans-serif;color:#4df3ff;direction:ltr;text-shadow:0 3px 0 rgba(0,0,0,.35)}
.ksb .n small{font-size:44px;opacity:.7}
.kdots{display:flex;gap:12px;direction:ltr}

.kdots i.on{background:#4df3ff;border-color:#fff;transform:scale(1.15)}
#kqrb{top:358px}#go{top:454px;height:92px;font-size:42px}
.kst{top:358px;height:188px;display:grid;place-items:center;text-align:center;font:800 30px/1.5 Cairo,sans-serif;padding:0 20px}
.dots i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#4df3ff;margin:0 4px;animation:kdt 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes kdt{0%,80%,100%{opacity:.25;transform:scale(.7)}40%{opacity:1;transform:scale(1.1)}}
/* five individual seats: 3 on top, 2 below */
#ksa{position:absolute;left:566px;top:14px;width:1116px;height:546px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:1fr 1fr;gap:22px 24px}
.ks{grid-column:span 2;position:relative;border-radius:22px;background:rgba(92,30,70,.55);border:4px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:border-color .15s,background .15s,transform .15s}
.ks:nth-child(4){grid-column:2/4}.ks:nth-child(5){grid-column:4/6}
.ks:hover{transform:translateY(-3px)}
.ks.sel{border-color:#ffd23f;background:rgba(255,210,63,.2)}.ks.me{background:rgba(70,22,54,.78)}
.ks.in{animation:kin .45s backwards}.ks.pop{animation:kpop .35s}
@keyframes kin{from{opacity:0;transform:translateY(30px) scale(.9)}}@keyframes kpop{0%{transform:scale(.9)}60%{transform:scale(1.04)}}
.knum{position:absolute;right:14px;top:12px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.3);border:3px solid rgba(255,255,255,.6);display:grid;place-items:center;font:900 24px/1 Cairo,sans-serif}
.kav{width:104px;height:104px;border-radius:50%;background:radial-gradient(#ecd0a8,#b58658);border:4px solid #fff;display:grid;place-items:center;font-size:58px}
.ks.bot .kav{background:radial-gradient(#b9c6d1,#6f8190)}
.ks.empty .kav{background:rgba(255,255,255,.12);border:4px dashed rgba(255,255,255,.6);font:900 56px/1 Cairo,sans-serif;color:rgba(255,255,255,.8)}
.ksn{font:900 32px/1.1 Cairo,sans-serif;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.ks.empty .ksn{font-weight:800;opacity:.85}
.kbg{display:flex;gap:8px}
.kbg b{font:800 20px/1 Cairo,sans-serif;padding:6px 14px;border-radius:20px;border:2px solid rgba(255,255,255,.7)}
.hu{background:#2fa55a}.bt{background:#e0821a}.ho{background:#c9a21a;color:#2a2200;border-color:#fff}
.kx,.kchip{cursor:pointer;color:#fff;font-weight:900;border:3px solid #ff948a;background:linear-gradient(#f2594d,#cc2821);box-shadow:0 4px 0 #8c1a17;padding:0}
.kx{position:absolute;left:12px;top:10px;width:50px;height:50px;border-radius:50%;font-size:22px}
.kchip{height:52px;padding:0 24px;border-radius:26px;font:900 24px Cairo,sans-serif;border-color:#8fd6ff;background:linear-gradient(#3cbcff,#0e86e0);box-shadow:0 4px 0 #0a5a9c}
.kx:active,.kchip:active{transform:translateY(2px)}
/* join view */
#kjv{position:absolute;inset:0}
.kjp{position:absolute;left:470px;top:24px;width:760px;height:520px}
.kjp .kjl{position:absolute;left:0;right:0;top:24px;text-align:center;font:900 38px/1.2 Cairo,sans-serif;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#ci{position:absolute;left:80px;top:92px;width:600px;height:100px;border-radius:20px;border:4px solid #f3b6e6;background:#1c1c1e;box-shadow:inset 0 4px 8px rgba(0,0,0,.6);color:#4df3ff;font:900 66px Cairo,sans-serif;letter-spacing:12px;text-align:center;outline:0;text-transform:uppercase}
#ci::placeholder{color:rgba(255,255,255,.25);letter-spacing:6px}
.kjp .kb{position:absolute;left:80px;width:600px;height:88px}
.kjp .kor{position:absolute;left:0;right:0;top:326px;text-align:center;font:800 26px/1 Cairo,sans-serif;opacity:.8}
/* QR / camera modal */
#md{position:absolute;inset:0;display:none;z-index:15;background:rgba(0,0,0,.35)}#md.on{display:block;animation:kfi .2s}
#mdin{position:absolute;left:0;top:0;width:2400px;height:1080px;transform:scale(.64);transform-origin:0 0;display:grid;place-items:center}
.kmc{position:relative;width:620px;padding:26px 30px 30px;border:8px solid #fff;border-radius:26px;background:linear-gradient(#10a6f4,#0376d2);box-shadow:0 12px 0 rgba(0,0,0,.28),0 0 60px rgba(0,0,0,.35);text-align:center;animation:kup .3s}
.kmc h2{margin:0 0 16px;font:900 42px/1.2 Cairo,sans-serif;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.qbox{display:grid;place-items:center;width:320px;height:320px;margin:0 auto;background:#fff;border-radius:16px;color:#222;font:900 40px Cairo,sans-serif}
.kmc video{width:100%;height:380px;object-fit:cover;border-radius:16px;background:#000}
.kmc p{margin:14px 0 0;font:800 24px/1.4 Cairo,sans-serif}
.kmc .kb{margin:18px auto 0;width:260px;height:68px;font-size:32px}
#toast{position:absolute;left:50%;top:630px;transform:translateX(-50%);background:rgba(0,0,0,.72);border:2px solid rgba(255,255,255,.6);border-radius:26px;padding:8px 28px;font-size:23px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap;z-index:30}
#toast.on{opacity:1}

<script>
const $=id=>document.getElementById(id);
/* قواعد الخبرة: عدّلها لتطابق باقي ألعابك */
const R={base:30,bonus:5,maxStreak:5}, need=l=>100+(l-1)*25;
let S={lvl:5,xp:50,streak:0,flag:'🇰🇼',name:'usbysg.'};
try{Object.assign(S,JSON.parse(localStorage.getItem('hs1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('hs1',JSON.stringify(S))}catch(e){}};

const FL="🇰🇼 الكويت,🇸🇦 السعودية,🇦🇪 الإمارات,🇶🇦 قطر,🇧🇭 البحرين,🇴🇲 عُمان,🇾🇪 اليمن,🇮🇶 العراق,🇸🇾 سوريا,🇯🇴 الأردن,🇵🇸 فلسطين,🇪🇬 مصر,🇱🇾 ليبيا,🇹🇳 تونس,🇩🇿 الجزائر,🇲🇦 المغرب,🇲🇷 موريتانيا,🇸🇩 السودان,🇸🇴 الصومال,🇩🇯 جيبوتي,🇰🇲 القمر,🇹🇷 تركيا,🇮🇷 إيران,🇵🇰 باكستان,🇦🇫 أفغانستان,🇧🇩 بنغلاديش,🇮🇩 إندونيسيا,🇲🇾 ماليزيا,🇧🇳 بروناي,🇲🇻 المالديف,🇦🇿 أذربيجان,🇺🇿 أوزبكستان,🇰🇿 كازاخستان,🇦🇱 ألبانيا,🇳🇪 النيجر,🇲🇱 مالي,🇸🇳 السنغال";
$('gr').innerHTML=FL.split(',').map(t=>{const[f,n]=t.split(' ');return `<button class="f" data-f="${f}"><span>${f}</span>${n}</button>`}).join('');
$('gr').onclick=e=>{const b=e.target.closest('.f');if(!b)return;S.flag=b.dataset.f;render();save()};

function render(){
 const p=Math.min(100,S.xp/need(S.lvl)*100);
 $('xpf').style.width=$('pf').style.width=p+'%';
 $('lvn').textContent=$('pl2').textContent=S.lvl;
 $('pt').textContent=S.xp+' / '+need(S.lvl)+' XP';
 $('fl').textContent=S.flag;$('un').textContent=S.name;
 document.querySelectorAll('.f').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flag));
}
function pop(t){
 const d=document.createElement('div');d.className='pop';d.textContent=t;
 ($('ov').classList.contains('on')?$('pm'):$('prof')).appendChild(d);setTimeout(()=>d.remove(),1300);
}
/* استدعِ addWin() عند فوز اللاعب، و resetStreak() عند الخسارة */
function addWin(){
 const g=R.base+Math.min(S.streak,R.maxStreak)*R.bonus;S.streak++;S.xp+=g;
 let up=false;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;up=true}
 render();save();pop(up?'ترقية! المستوى '+S.lvl+' 🎉':'+'+g+' XP');
 if(up){const s=$('lvs');s.classList.remove('bump');void s.offsetWidth;s.classList.add('bump')}
}
function resetStreak(){S.streak=0;save()}
function openP(){$('nm').value=S.name;$('ov').classList.add('on')}
function closeP(){$('ov').classList.remove('on')}
$('ov').onclick=e=>{if(e.target===$('ov'))closeP()};
$('nm').oninput=e=>{S.name=e.target.value.trim()||'usbysg.';render();save()};
render();

/* أفق المدينة */
const B=[[0,60,482],[60,60,512],[120,70,532],[190,60,500],[250,50,542],[300,60,490],[360,60,532],[420,50,512],[470,40,562],[505,55,440],[560,45,522],[600,50,578],[650,50,546],[700,45,582],[800,50,572],[850,50,536],[900,60,592],[960,60,546],[1020,50,510],[1070,40,552],[1110,38,468],[1148,52,522],[1200,60,562],[1260,60,536],[1320,50,502],[1370,50,546],[1420,50,486],[1470,66,530]];
let k='<g fill="#3b4247">';
B.forEach(([x,w,t])=>k+=`<rect x="${x+w/2}" y="${t-38}" width="${w}" height="400"/>`);
k+='</g><g fill="#4b5359"><rect x="764" y="500" width="10" height="140"/><ellipse cx="769" cy="494" rx="16" ry="30"/><rect x="767" y="430" width="4" height="64"/></g><g fill="#25292c">';
B.forEach(([x,w,t])=>{k+=`<rect x="${x}" y="${t}" width="${w+1}" height="${640-t}"/>`;if(t<500)k+=`<rect x="${x+w/2-1}" y="${t-26}" width="3" height="27"/>`});
$('sk').innerHTML=k+'</g>';

/* ملاءمة الشاشة (تدور تلقائياً لو الجوال طولي) */
function fit(){const w=innerWidth,h=innerHeight,p=h>w,s=p?Math.min(h/1536,w/691):Math.min(w/1536,h/691);
 $('st').style.transform=`translate(-50%,-50%)${p?' rotate(90deg)':''} scale(${s})`}
addEventListener('resize',fit);fit();

/* ===== SCREENS: lobby (training + shared play) -> room ===== */
const ROOM_SEATS = 5, ROOM_BOT_LEVEL = 'medium';            // room: 5 individual seats, no teams
const TRAIN = { players: 4, target: 26, botLevel: 'medium' }; // defaults for a new training match
const fire = (n, d) => window.dispatchEvent(new CustomEvent(n, { detail: d }));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tt; function toast(m) { const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2200); }

/* ---- navigation: home <-> lobby <-> room (animated) ---- */
const PG = { lobby: $('kp1'), room: $('kp2') };
let cur = 'home', busy = false;
function nav(to) {
  if (busy || to === cur) return; busy = true;
  const from = cur, o = PG[from], n = PG[to], scr = $('scr'); cur = to;
  if (n) { n.classList.remove('out'); n.style.display = 'block'; n.classList.add('in'); }
  if (from === 'home') { scr.style.display = 'block'; scr.classList.remove('fadeout'); scr.classList.add('fadein'); }
  if (o) o.classList.add('out');
  if (to === 'home') scr.classList.add('fadeout');
  setTimeout(() => {
    if (o) { o.style.display = 'none'; o.classList.remove('in', 'out'); }
    if (n) n.classList.remove('in');
    scr.classList.remove('fadein'); if (to === 'home') { scr.style.display = 'none'; scr.classList.remove('fadeout'); }
    busy = false;
  }, 320);
}
function goBack() {
  fire('goback', { from: cur });
  if (cur === 'room') { fire('leaveroom', { code }); nav('lobby'); } else if (cur === 'lobby') nav('home');
}
addEventListener('keydown', e => { if (e.key === 'Escape' && cur !== 'home' && !$('md').classList.contains('on') && !$('ov').classList.contains('on')) goBack(); });

/* ---- training: [resume] (only when a previous match exists) + new match ---- */
const trainPrev = () => { try { return JSON.parse(localStorage.getItem('hs_prev') || 'null'); } catch (e) { return null; } };
function renderTrain(animate) {
  const has = !!trainPrev(), r = $('kres');
  r.style.display = has ? '' : 'none'; $('kcap').style.display = has ? 'none' : '';
  r.classList.remove('show'); if (has && animate) { void r.offsetWidth; r.classList.add('show'); }
}
/* call from your game: setTrainingSave(stateObject) while a match is in progress, setTrainingSave(null) when it ends */
function setTrainingSave(o) { try { o ? localStorage.setItem('hs_prev', JSON.stringify(o)) : localStorage.removeItem('hs_prev'); } catch (e) {} renderTrain(true); }
function newTraining() { setTrainingSave(Object.assign({ t: Date.now() }, TRAIN)); toast('بدء مباراة جديدة'); fire('startgame', Object.assign({ resume: false }, TRAIN)); }
function resumeTraining() { const p = trainPrev(); if (!p) return; toast('استئناف المباراة'); fire('startgame', Object.assign({}, p, { resume: true })); }
renderTrain(false);

/* ---- room ---- */
let mode = 'host', code = '', seats = Array(ROOM_SEATS).fill(null), selSeat = null;
const rand = () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let r = ''; for (let i = 0; i < 5; i++) r += a[Math.random() * a.length | 0]; return r; };
$('kot').textContent = ROOM_SEATS;
function createRoom() { openRoom('host'); nav('room'); fire('createroom'); }
function joinRoom() { openRoom('join'); nav('room'); fire('joinroom'); }
function openRoom(m, c) {
  mode = m; selSeat = null; seats = Array(ROOM_SEATS).fill(null); $('ksa').innerHTML = '';
  $('kr').className = m; $('ttl').textContent = m === 'host' ? 'إنشاء غرفة' : 'الانضمام إلى غرفة';
  if (m === 'host') { code = rand(); seats[0] = { t: 'h', name: S.name, host: 1, me: 1 }; showRoom(true); }
  else if (c) enterRoom(c); else { showRoom(false); $('ci').value = ''; }
}
function showRoom(inRoom) { $('kjv').style.display = inRoom ? 'none' : 'block'; $('krv').style.display = inRoom ? 'block' : 'none'; if (inRoom) renderRoom(); }
/* hook to your network: on a successful join replace `seats` with what the host sends, then call renderRoom() */
function enterRoom(c) {
  code = c.toUpperCase(); seats = Array(ROOM_SEATS).fill(null);
  seats[0] = { t: 'h', name: 'المضيف', host: 1 }; seats[1] = { t: 'h', name: S.name, me: 1 };
  showRoom(true); fire('joinroom-request', { code });
}
function joinCode() { const v = $('ci').value.trim(); if (v.length < 4) { toast('أدخل رمز الغرفة'); return; } enterRoom(v); }

function seatInner(i) {
  const s = seats[i], H = mode === 'host', num = `<span class="knum">${i + 1}</span>`;
  if (!s) return num + `<div class="kav">+</div><div class="ksn">مقعد فارغ</div>${H ? '<button class="kchip" data-a="bot">+ بوت</button>' : ''}`;

<script>

  const vw = innerWidth, vh = innerHeight, port = vh > vw, Lw = port ? vh : vw, Lh = port ? vw : vh;
  dpr = Math.min(devicePixelRatio || 1, 3);
  frame.style.width = Lw + 'px'; frame.style.height = Lh + 'px';
  frame.style.transform = 'translate(-50%,-50%)' + (port ? ' rotate(90deg)' : '');
  W = cv.width = Math.round(Lw * dpr); H = cv.height = Math.round(Lh * dpr);
  P = Math.max(1, Math.round(CREEPER_HEIGHT * dpr / 26));            // device px per Minecraft pixel
  OW = 28 * P; OH = 30 * P; OX = 10 * P; OY = 28 * P; spr.width = OW; spr.height = OH; sg = spr.getContext('2d');
  footY = Math.round(H / 2 + 13 * P); dir = START_SIDE === 'right' ? -1 : 1;
  const k = CARD_H / IMG.ch;                                           // css px per picture pixel
  cw = IMG.cw * k * dpr; ch = CARD_H * dpr;
  wrap.style.width = IMG.w * k + 'px'; wrap.style.height = IMG.h * k + 'px';
  wrap.style.left = (Lw / 2 - IMG.w * k / 2) + 'px'; wrap.style.top = (footY / dpr - (IMG.py + IMG.ch) * k) + 'px';
  stopU = W / 2 - cw / 2 - 6 * P;                                      // distance from the start edge where the creeper stops
}

/* ---------- sound (synthesized placeholders) ---------- */
let AC, srcs = [];
const ac = () => { if (!SOUND_ON) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); AC.state === 'suspended' && AC.resume(); } catch (e) {} return AC; };
const noise = (a, sec) => { const b = a.createBuffer(1, a.sampleRate * sec | 0, a.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; const s = a.createBufferSource(); s.buffer = b; srcs.push(s); return s; };
const playFile = u => { const a = new Audio(u); a.play().catch(() => {}); srcs.push({ stop() { a.pause(); } }); };
const stopAudio = () => { srcs.forEach(s => { try { s.stop(); } catch (e) {} }); srcs = []; };
function sfxFuse() { // "tssss"
  if (SFX_FUSE_URL) return playFile(SFX_FUSE_URL);
  const a = ac(); if (!a) return; const s = noise(a, FUSE_DURATION), f = a.createBiquadFilter(), g = a.createGain(), n = a.currentTime;
  f.type = 'highpass'; f.frequency.value = 3000; g.gain.setValueAtTime(0, n); g.gain.linearRampToValueAtTime(.2, n + .08); g.gain.linearRampToValueAtTime(.32, n + FUSE_DURATION);
  s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
function sfxBoom() { // noise sweep + low thump
  if (SFX_EXPLODE_URL) return playFile(SFX_EXPLODE_URL);
  const a = ac(); if (!a) return; const s = noise(a, 1.6), f = a.createBiquadFilter(), g = a.createGain(), o = a.createOscillator(), og = a.createGain(), n = a.currentTime;
  f.type = 'lowpass'; f.frequency.setValueAtTime(2200, n); f.frequency.exponentialRampToValueAtTime(60, n + 1.4);
  g.gain.setValueAtTime(.9, n); g.gain.exponentialRampToValueAtTime(.001, n + 1.5);
  o.frequency.setValueAtTime(110, n); o.frequency.exponentialRampToValueAtTime(30, n + .8); og.gain.setValueAtTime(.8, n); og.gain.exponentialRampToValueAtTime(.001, n + .9);
  s.connect(f); f.connect(g); g.connect(a.destination); o.connect(og); og.connect(a.destination); s.start(); o.start(); o.stop(n + 1);
}

/* ---------- explosion: card shards (real picture tiles), pixel debris, fire, smoke ---------- */
let parts = [];
const DEB = ['#e0b24a','#f6d77a','#a47a1e','#0b1230','#16224d','#2f6bff','#4d8dff'].concat(PAL), FIRE = ['#fff','#ffe680','#ffd84a','#ff9a1f','#ff5a14'], SMK = ['#444','#666','#888','#aaa'];
function spawn() {
  const r = Math.random, cx0 = W / 2, cy0 = footY - ch / 2, o = () => r() < .5 ? [dir > 0 ? stopU : W - stopU, footY - 13 * P] : [cx0, cy0];
  const add = (n, f) => { for (let i = 0; i < n; i++) { const [x, y] = o(), a = r() * 6.283; parts.push(Object.assign({ x, y, t: 0, a: 1, g: 0, d: 0, gr: 0 }, f(a))); } };
  const cols = 5, rows = 7;                                            // the card breaks into 35 picture tiles
  for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
    const x = cx0 + ((i + .5) / cols - .5) * cw, y = footY - ch + (j + .5) / rows * ch, a = Math.atan2(y - cy0, x - cx0) + (r() - .5) * .6, v = (180 + r() * 520) * dpr;
    parts.push({ tile: 1, sx: IMG.px + i * IMG.cw / cols, sy: IMG.py + j * IMG.ch / rows, sw: IMG.cw / cols, sh: IMG.ch / rows, w: cw / cols + 1, h: ch / rows + 1,
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 260 * dpr, g: 1500 * dpr, d: .4, rot: 0, vr: (r() - .5) * 10, t: 0, a: 1, gr: 0, s: 0, l: .9 + r() * .8 });
  }
  add(110, a => { const v = (120 + r() * 650) * dpr; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 220 * dpr, g: 1500 * dpr, d: .3, s: (.7 + r() * 1.3) * P, c: DEB[r() * DEB.length | 0], l: .9 + r() * .9 }; });
  add(50, a => { const v = (100 + r() * 500) * dpr; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v, d: 2.2, s: (1 + r() * 2) * P, c: FIRE[r() * FIRE.length | 0], l: .3 + r() * .4 }; });
  add(7, a => ({ vx: 0, vy: 0, s: (8 + r() * 6) * P, c: FIRE[r() * 2 | 0], l: .25, gr: 40 * P }));
  add(28, a => { const v = (40 + r() * 220) * dpr; return { vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50 * dpr, d: 1.4, s: (3 + r() * 3) * P, gr: 6 * P, c: SMK[r() * 4 | 0], l: .9 + r() * .7, a: .8 }; });
}
function drawParts(dt) {
  for (const p of parts) { p.t += dt; if (p.t >= p.l) continue;
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 1 - p.d * dt; p.vy *= 1 - p.d * dt; p.s += p.gr * dt;
    ctx.globalAlpha = Math.min(1, (1 - p.t / p.l) * p.a * (p.tile ? 1.6 : 1));
    if (p.tile) { ctx.save(); ctx.translate(Math.round(p.x), Math.round(p.y)); ctx.rotate(p.rot += p.vr * dt); ctx.imageSmoothingEnabled = true;
      ctx.drawImage(cardImg, p.sx, p.sy, p.sw, p.sh, -p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); ctx.imageSmoothingEnabled = false; continue; }
    ctx.fillStyle = p.c; const s = Math.max(1, Math.round(p.s)); ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s); }
  ctx.globalAlpha = 1;
}

/* ---------- timeline ---------- */
let t0 = 0, last = 0, fph = 0, fused = false, boomed = false, done = false, shakeAt = 0, raf = 0;
function frame_(now) {
  raf = requestAnimationFrame(frame_);
  if (!t0) t0 = last = now;
  const t = (now - t0) / 1e3, dt = Math.min(.05, (now - last) / 1e3); last = now;
  ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, W, H);
  if (!boomed) { // faint blue glow on the "floor" under the card
    const R = cw * .9, g = ctx.createRadialGradient(0, 0, 0, 0, 0, R); g.addColorStop(0, 'rgba(60,110,255,.28)'); g.addColorStop(1, 'rgba(60,110,255,0)');
    ctx.save(); ctx.translate(W / 2, footY); ctx.scale(1, .16); ctx.fillStyle = g; ctx.fillRect(-R, -R, 2 * R, 2 * R); ctx.restore(); }
  const tI = INTRO_DELAY, tL = tI + LOOK_DURATION, tR = tL + RUN_DURATION, tF = tR + FUSE_DURATION;
  let u = -4 * P, dx = 5 * P, ang = 0, yaw = 0, sc = 1, white = false, show = true; // u = body centre, measured from the start edge
  if (t < tI) show = false;                                                       // 0) card only
  else if (t < tL) { const a = t - tI, s = Math.min(1, a / .35), e = 1 - (1 - s) * (1 - s);   // 1) only the head peeks out of the edge and scans
    u = (-5 + 6 * e) * P - 5 * P; yaw = yawAt(Math.max(0, (a - .35) / (LOOK_DURATION - .35))); }
  else if (t < tR) { const r = t - tL;                                            // 2) straight, constant-speed run
    u = -4 * P + (stopU + 4 * P) * r / RUN_DURATION; dx = 5 * P * Math.max(0, 1 - r / .3);
    ang = Math.sin(r * RUN_STRIDE_HZ * 6.2832) * LEG_SWING_DEG * Math.PI / 180 * Math.min(1, r / .1); }
  else if (!boomed) { u = stopU; dx = 0; const p = Math.min(1, (t - tR) / FUSE_DURATION);  // 3) swell + flash
    if (!fused) { fused = true; sfxFuse(); }
    fph += dt * (5 + 10 * p); white = (fph | 0) % 2 === 0; sc = 1 + .5 * p * p + .03 * p * Math.sin(p * 60);
    if (t >= tF) explode(now); }
  if (!boomed && show) {
    drawCreeper(ang, yaw, white, dx);
    ctx.save(); ctx.translate(Math.round(dir > 0 ? u : W - u), footY); ctx.scale(dir * sc, sc);
    ctx.drawImage(spr, -OX, -OY); ctx.restore();
  }
  drawParts(dt);
  if (shakeAt) { const k = (now - shakeAt) / 1e3 / SHAKE_TIME;
    if (k < 1) { const a = SHAKE_PX * (1 - k) * (1 - k); document.body.style.transform = `translate(${(Math.random() * 2 - 1) * a}px,${(Math.random() * 2 - 1) * a}px)`; }
    else { document.body.style.transform = ''; shakeAt = 0; } }
}
function explode(now) {
  boomed = true; stopAudio(); sfxBoom(); spawn(); shakeAt = now;
  wrap.style.display = 'none';                                     // the card is destroyed
  flash.style.transition = 'none'; flash.style.opacity = 1;       // white flash...
  intro.style.background = 'transparent'; hint.style.display = 'none'; stage.classList.add('go'); // ...hides the swap to the main screen
  setTimeout(() => { flash.style.transition = 'opacity .8s ease-out'; flash.style.opacity = 0; }, 90); // quick fade from white
  setTimeout(finish, AFTER_BOOM * 1000);
}
function finish() { if (done) return; done = true; cancelAnimationFrame(raf); document.body.style.transform = ''; intro.remove(); }
function skip() { if (done) return; done = true; stopAudio(); cancelAnimationFrame(raf); document.body.style.transform = '';
  stage.classList.add('go'); intro.style.transition = 'opacity .3s'; intro.style.opacity = 0; setTimeout(() => intro.remove(), 320); }

if (SKIP_ENABLED) { intro.addEventListener('pointerdown', skip); addEventListener('keydown', e => ['Escape', ' ', 'Enter'].includes(e.key) && skip()); }
else hint.style.display = 'none';
addEventListener('resize', layout);
layout(); raf = requestAnimationFrame(frame_);
})();
</script>
